<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Climb The Tower of Hope</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 6px solid #222;
      background: #0b1020;
    }
    p.hint {
      position: fixed;
      left: 10px;
      top: 10px;
      color: #ddd;
      font-family: monospace;
      font-size: 12px;
      z-index: 20;
    }

    /* Loading overlay */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(3,7,12,0.95), rgba(3,7,12,0.85));
      z-index: 9999;
      pointer-events: auto;
      opacity: 1;
      color: #ddd;
      font-family: monospace;
    }
    #loading .box {
      width: 360px;
      max-width: 80vw;
      padding: 18px;
      text-align: center;
      border: 2px solid #2a3b4a;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02));
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    #loading .title {
      font-size: 16px;
      margin-bottom: 8px;
      color: #eaf6ff;
      letter-spacing: 1px;
    }
    #loading .sub {
      font-size: 11px;
      color: #a9c2d4;
      margin-bottom: 12px;
    }
    #loading .bar {
      height: 10px;
      width: 100%;
      background: #1a2a34;
      border-radius: 6px;
      overflow: hidden;
    }
    #loading .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#6fe27e,#3bb0ff);
      transition: width 140ms linear;
    }
    #loading .pct {
      font-size: 11px;
      color: #cfe8ff;
      margin-top: 8px;
    }

    @media (max-width:420px) {
      #loading .box { padding: 12px; }
    }
  </style>
</head>
<body>
  <p class="hint">W = jump • S = slide • A/D = move • Climb The Tower of Hope</p>
  <canvas id="game"></canvas>

  <!-- Loading overlay -->
  <div id="loading" aria-hidden="false">
    <div class="box" role="status" aria-live="polite">
      <div class="title">Climb The Tower of Hope — Loading</div>
      <div class="sub">Preparing the mountain…</div>
      <div class="bar"><div class="fill" id="loadFill"></div></div>
      <div class="pct" id="loadPct">0%</div>
    </div>
  </div>

  <script>
    // Configuration (logical resolution for pixel look)
    const LOGW = 320, LOGH = 180;
    const SCALE = Math.floor(Math.min(window.innerWidth / LOGW, window.innerHeight / LOGH));
    const CANVAS_W = LOGW * SCALE, CANVAS_H = LOGH * SCALE;

    const canvas = document.getElementById('game');
    canvas.width = LOGW;
    canvas.height = LOGH;
    canvas.style.width = CANVAS_W + 'px';
    canvas.style.height = CANVAS_H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Input
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // World
    let cameraY = 0;
    const gravity = 0.45;
    const platforms = [];
    const PLATFORM_GAP = 26;
    const PLATFORM_MIN_X = 8;
    const PLATFORM_MAX_X = LOGW - 40;
    const PLATFORM_W = 64;
    const PLATFORM_H = 6;

    // Make a full-width spawn floor where player starts
    const SPAWN_FLOOR_Y = LOGH - 20;
    platforms.push({ x: 0, y: SPAWN_FLOOR_Y, w: LOGW, h: PLATFORM_H });

    // Player
    const player = {
      x: LOGW/2, y: LOGH - 40,
      w: 8, h: 12,
      vx: 0, vy: 0,
      speed: 0.7, maxSpeed: 2.2,
      facing: 1, onGround: false,
      sliding: false, slideTimer: 0
    };

    // track spawn baseline and best altitude
    const spawnY = player.y;
    let maxAltitude = 0;

    // Particles
    const particles = [];
    function spawnParticle(x,y,source='jump'){
      const angle = (Math.random()*Math.PI*2);
      const speed = (source==='jump')? (1.5 + Math.random()*1.2) : (0.7 + Math.random()*0.8);
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed + player.vx*0.4,
        vy: Math.sin(angle)*speed + player.vy*0.4,
        life: 40 + Math.random()*30,
        size: 1 + Math.random()*2,
        alpha: 1
      });
    }

    // Procedural tower/mountain init
    function genPlatformsUpTo(yTop){
      // ensure there are platforms above yTop (lower y means up)
      let highest = platforms.length ? Math.min(...platforms.map(p=>p.y)) : LOGH;
      while (highest > yTop){
        highest -= PLATFORM_GAP;
        const px = PLATFORM_MIN_X + Math.random()*(PLATFORM_MAX_X-PLATFORM_MIN_X);
        const pw = PLATFORM_W + (Math.random()*40 - 20);
        platforms.push({x:px, y:highest, w:pw, h:PLATFORM_H});
      }
    }
    // pre-generate a deeper region (will be done during loading)
    genPlatformsUpTo(-400);

    // Basic collision
    function checkLanding(p){
      p.onGround = false;
      for (let plat of platforms){
        // AABB
        if (p.x + p.w > plat.x && p.x < plat.x + plat.w){
          const py = p.y + p.h;
          const prevY = p.y - p.vy; // previous frame approx
          if (py >= plat.y && prevY + p.h <= plat.y + 1 && p.vy >= 0){
            p.y = plat.y - p.h;
            p.vy = 0;
            p.onGround = true;
            p.sliding = false;
          }
        }
      }
    }

    // Game loop
    let last = performance.now();
    function step(now){
      const dt = Math.min(32, now - last) / 16;
      last = now;

      // Controls
      if (keys['a']) {
        player.vx -= player.speed * dt;
        player.facing = -1;
      }
      if (keys['d']) {
        player.vx += player.speed * dt;
        player.facing = 1;
      }

      // Jump (W)
      if (keys['w'] && player.onGround) {
        player.vy = -7;
        player.onGround = false;
        // spawn jump particles
        for (let i=0;i<12;i++) spawnParticle(player.x + player.w/2, player.y + player.h, 'jump');
      }

      // Slide (S)
      if (keys['s'] && player.onGround && !player.sliding){
        player.sliding = true;
        player.slideTimer = 18;
        player.vx = player.facing * (player.maxSpeed + 1.6);
      }

      // Slide timer handling
      if (player.sliding){
        player.slideTimer -= dt;
        // spawn continuous slide particles that "follow" player
        if (Math.random() < 0.6) {
          spawnParticle(player.x + player.w/2 - player.facing*6, player.y + player.h - 1, 'slide');
        }
        if (player.slideTimer <= 0) {
          player.sliding = false;
        }
      }

      // Physics
      player.vy += gravity * dt;
      // friction
      if (player.onGround && !player.sliding) {
        player.vx *= 0.8;
      } else {
        player.vx *= 0.995;
      }
      // clamp
      const max = player.maxSpeed + (player.sliding ? 1.6 : 0);
      if (player.vx > max) player.vx = max;
      if (player.vx < -max) player.vx = -max;

      player.x += player.vx * dt;
      player.y += player.vy * dt;

      // Screen wrap-ish or clamp
      if (player.x < -10) player.x = LOGW + 10;
      if (player.x > LOGW + 10) player.x = -10;

      // Collision
      checkLanding(player);

      // Camera: follow player upward (climb)
      cameraY += ((player.y - LOGH/2) - cameraY) * 0.12;

      // Generate platforms above as you climb
      genPlatformsUpTo(cameraY - LOGH*2);

      // Remove far below platforms (opt)
      for (let i = platforms.length-1; i >= 0; i--){
        if (platforms[i].y > cameraY + LOGH + 200) platforms.splice(i,1);
      }

      // Particles update (with "following" attraction)
      for (let i = particles.length-1; i >= 0; i--){
        const p = particles[i];
        // attraction to player (makes them follow)
        const dx = (player.x + player.w/2) - p.x;
        const dy = (player.y + player.h/2) - p.y;
        const dist = Math.max(1, Math.hypot(dx,dy));
        const attract = 0.03; // tune follow strength
        p.vx += (dx / dist) * attract * (p.life/120);
        p.vy += (dy / dist) * attract * (p.life/120);
        // apply velocity
        p.x += p.vx * dt;
        p.y += p.vy * dt - 0.05*dt; // slight upward drift
        p.life -= dt;
        p.alpha = Math.max(0, p.life / 70);
        if (p.life <= 0) particles.splice(i,1);
      }

      render();
      requestAnimationFrame(step);
    }

    // draw layered mountains (more mountain-like background)
    function drawMountains(){
      // parallax factors from back to front
      const layers = [
        { color:'#081826', offset:0.02, heightBase:70, tint:'#072231' },
        { color:'#0d3a46', offset:0.06, heightBase:50, tint:'#0b4b5a' },
        { color:'#185a68', offset:0.12, heightBase:30, tint:'#1c6f7f' }
      ];
      for (let li=0; li<layers.length; li++){
        const L = layers[li];
        ctx.fillStyle = L.color;
        ctx.beginPath();
        ctx.moveTo(0, LOGH);
        // create a few big peaks across the width
        const camOffset = cameraY * L.offset;
        const peaks = 5;
        for (let i=0;i<=peaks;i++){
          const t = i / peaks;
          const x = t * LOGW;
          // varied height: stronger center peak
          const centerBias = 1 - Math.abs(0.5 - t) * 2;
          const noise = Math.sin((i*67 + camOffset*0.6)*0.24) * 8;
          const y = LOGH - (L.heightBase + centerBias*80 + noise) + camOffset*6;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(LOGW, LOGH);
        ctx.closePath();
        ctx.fill();

        // snowcaps on front-most peaks for the last layer
        if (li === layers.length - 1) {
          ctx.fillStyle = '#eaf6ff';
          for (let i=0;i<peaks;i++){
            const t = (i + 0.5) / peaks;
            const x = t * LOGW;
            const centerBias = 1 - Math.abs(0.5 - t) * 2;
            const px = x + Math.sin((i*41 + camOffset)*0.18)*6;
            const py = LOGH - (L.heightBase + centerBias*80) + camOffset*6;
            // small triangle cap
            ctx.beginPath();
            ctx.moveTo(px, py - 2);
            ctx.lineTo(px - 10, py + 10);
            ctx.lineTo(px + 10, py + 10);
            ctx.closePath();
            ctx.fill();
          }
        }
      }
    }

    // Rendering
    function render(){
      // clear
      ctx.fillStyle = '#0b1020';
      ctx.fillRect(0,0,LOGW,LOGH);

      // mountain background
      drawMountains();

      // draw platforms
      for (let plat of platforms){
        const py = plat.y - cameraY;
        if (py < -50 || py > LOGH + 50) continue;
        ctx.fillStyle = '#4f6b2a';
        // pixel outline
        ctx.fillRect(Math.round(plat.x), Math.round(py), Math.round(plat.w), plat.h);
        ctx.fillStyle = '#6fa545';
        ctx.fillRect(Math.round(plat.x)+2, Math.round(py)+1, Math.max(1, Math.round(plat.w)-4), plat.h-2);
      }

      // draw particles (gray, small pixel-like)
      for (let p of particles){
        const sx = Math.round(p.x);
        const sy = Math.round(p.y - cameraY);
        ctx.globalAlpha = p.alpha * 0.9;
        ctx.fillStyle = '#9aa0a6';
        const s = Math.max(1, Math.round(p.size));
        ctx.fillRect(sx, sy, s, s);
        ctx.globalAlpha = 1;
      }

      // draw player (pixel art)
      const px = Math.round(player.x);
      const py = Math.round(player.y - cameraY);
      ctx.fillStyle = '#f2c94c';
      // body
      ctx.fillRect(px, py, player.w, player.h);
      // eyes (simple)
      ctx.fillStyle = '#1b1b1b';
      ctx.fillRect(px + (player.facing>0?5:1), py+3, 2, 2);
      // small feet when sliding
      if (player.sliding){
        ctx.fillStyle = '#d9a22a';
        ctx.fillRect(px - player.facing*2, py + player.h - 2, player.w + 4, 2);
      }

      // HUD: simple height (now relative to spawn)
      const altitude = Math.max(0, Math.floor(spawnY - player.y));
      if (altitude > maxAltitude) maxAltitude = altitude;
      ctx.fillStyle = '#ddd';
      ctx.font = "6px monospace";
      ctx.fillText("HEIGHT: " + altitude, 6, 10);

      // Altitude bar (right side)
      const barW = 6;
      const barH = LOGH - 20;
      const bx = LOGW - 8 - barW;
      const by = 10;
      // background / border
      ctx.fillStyle = '#08121a';
      ctx.fillRect(bx-1, by-1, barW+2, barH+2);
      ctx.fillStyle = '#0f1720';
      ctx.fillRect(bx, by, barW, barH);
      // dynamic scale (so bar grows as you reach new heights)
      const scaleMax = Math.max(120, maxAltitude + 60);
      const filledH = Math.min(barH, (altitude / scaleMax) * barH);
      // filled amount (green)
      ctx.fillStyle = '#7ed957';
      ctx.fillRect(bx, by + barH - filledH, barW, filledH);
      // current altitude marker (white horizontal line)
      const markerY = by + barH - Math.min(barH, (altitude / scaleMax) * barH);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx - 8, markerY - 1, barW + 16, 2);
      // max altitude tick (yellow)
      const maxTickY = by + barH - Math.min(barH, (maxAltitude / scaleMax) * barH);
      ctx.fillStyle = '#ffd24d';
      ctx.fillRect(bx - 2, maxTickY - 1, barW + 4, 1);
      // numeric readout under the bar
      ctx.fillStyle = '#ddd';
      ctx.fillText(altitude + "m", bx - 22, by + barH + 8);
    }

    // Start loop is deferred until loading finishes
    function startGame(){
      const loadEl = document.getElementById('loading');
      if (loadEl){
        // block interactions and fade out cleanly
        loadEl.style.pointerEvents = 'none';
        loadEl.style.transition = 'opacity 400ms ease';
        loadEl.style.opacity = 0;
        setTimeout(()=>{ if (loadEl.parentNode) loadEl.parentNode.removeChild(loadEl); }, 450);
      }
      last = performance.now();
      requestAnimationFrame(step);
    }

    // Simulated loading progress + pre-generation of deeper platforms
    (function simulateLoad(){
      const fill = document.getElementById('loadFill');
      const pct = document.getElementById('loadPct');
      let progress = 0;
      // heavy pregen to feel like loading
      const targetDepth = -2200;
      const steps = 60;
      let iter = 0;
      function doStep(){
        iter++;
        // progressively gen more platforms upward
        const yTarget = spawnY + (targetDepth * (iter / steps));
        genPlatformsUpTo(yTarget);
        progress = Math.min(100, Math.floor((iter / steps) * 96 + Math.random()*4));
        if (fill) fill.style.width = progress + '%';
        if (pct) pct.textContent = progress + '%';
        if (iter < steps){
          setTimeout(doStep, 18 + Math.random()*22);
        } else {
          // finalize and small delay so UI shows 100%
          if (fill) fill.style.width = '100%';
          if (pct) pct.textContent = '100%';
          setTimeout(startGame, 400);
        }
      }
      setTimeout(doStep, 120);
    })();

    // Resize handler to maintain scaling crispness
    window.addEventListener('resize', () => {
      const s = Math.floor(Math.min(window.innerWidth / LOGW, window.innerHeight / LOGH)) || 1;
      canvas.style.width = (LOGW*s) + 'px';
      canvas.style.height = (LOGH*s) + 'px';
    });
  </script>
</body>
</html>
